[project]
name = "pasarela-austral-due-diligence"
version = "0.1.0"
description = "Due diligence de comercios para Pasarela Austral (datos ficticios)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["mcp_server", ".claude/hooks/tests", "scripts/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
